[project]
name = "link-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "environs>=15.0.1",
    "openpyxl>=3.1.5",
    "playwright>=1.60.0",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "RUF"]
ignore = ["F821", "F841"]
